{% extends 'plantilla.html' %}
{% load static %}
{% block content %}

<div class="container-form mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" class="fom-login p-4 rounded shadow">
                <h2 class="text-center mb-4">Recuperar contraseña</h2>
                {% csrf_token %}
                <p>Por favor, ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

                <div class="form-group">
                    {{ form.email.label_tag }}
                    {{ form.email }}
                </div>

                <br>
                <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>

                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary">Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
