{% extends 'plantilla.html' %}
{% block title %}<title>Editar Empleado</title>{% endblock %}

{% load static %}
{% block content %}
{% include 'components/header.html' %}

<header class="page-header mb-4">
  <div class="container">
    <h1><i class="fas fa-user-pen"></i> Editar Empleado</h1>
  </div>
</header>

<style>
  .card-style {
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    max-width: 800px;
    margin: 20px auto;
    padding: 30px
  }

  .form-group {
    margin-bottom: 15px
  }

  .form-group label {
    font-weight: bold
  }

  .no-change {
    border: 2px solid #dc3545 !important
  }
</style>

<div class="container">
  <div class="card-style">
    <form id="form-editar" method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}

      <div class="d-flex gap-2 mt-3">
        <button type="button" class="btn btn-primary" onclick="confirmarGuardado()">Guardar Cambios</button>
        <a href="{% url 'usuarios:registrar_empleado' %}" class="btn btn-secondary">Volver</a>
      </div>
    </form>
  </div>
</div>

<script>
  // Almacenar valores iniciales
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('form-editar');
    const fd = new FormData(form);
    window.initialData = new Map();
    for (const [k, v] of fd.entries()) { window.initialData.set(k, (v || '').trim()); }

    // Quitar borde rojo al editar
    form.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => el.classList.remove('no-change'));
    });
  });

  function confirmarGuardado() {
    const form = document.getElementById('form-editar');
    const fd = new FormData(form);
    let cambios = false;

    // quitar marcas anteriores
    form.querySelectorAll('.no-change').forEach(el => el.classList.remove('no-change'));

    // validar obligatorios (todos excepto telefono_fijo)
    for (const [k, v] of fd.entries()) {
      const valorActual = (v || '').trim();
      const valorInicial = (window.initialData.get(k) || '');

      // Validar obligatorios (excepto telefono_fijo)
      if (k !== 'telefono_fijo' && !valorActual) {
        const campo = form.querySelector(`[name="${k}"]`);
        if (campo) { campo.classList.add('no-change'); campo.focus(); }
        return;
      }

      // Detectar cambios (incluyendo telefono_fijo)
      if (valorActual !== valorInicial) { cambios = true; }
    }

    // Si ningún campo cambió, resaltar todos
    if (!cambios) {
      form.querySelectorAll('input, select, textarea').forEach(el => el.classList.add('no-change'));
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // Si pasó validación y hay cambios, enviar
    form.submit();
  }
</script>
{% endblock %}
