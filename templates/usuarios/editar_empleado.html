{% extends 'plantilla.html' %}
{% block title %}
  <title>Editar Empleado</title>
{% endblock %}

{% load static %}

{% block content %}
{% include 'components/header.html' %}

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  .card-style {
    background: white;
    border-radius: 15px;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
    max-width: 800px;
    margin: 20px auto;
    padding: 30px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    font-weight: bold;
  }

  .btn-group {
    display: flex;
    gap: 10px;
  }
</style>

<header class="page-header mb-4">
  <div class="container">
    <h1><i class="fa-solid fa-user-pen"></i> Editar Empleado</h1>
  </div>
</header>

<main class="container">
  <div class="card-style">
    <form id="form-editar" method="post">
      {% csrf_token %}

      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}

      <div class="btn-group mt-3">
        <button type="button" class="btn btn-primary" onclick="confirmarGuardado()">Guardar Cambios</button>
        <a href="{% url 'usuarios:registrar_empleado' %}" class="btn btn-secondary">Volver</a>
      </div>
    </form>
  </div>
</main>

<script>
  // Guardar valores iniciales al cargar la página
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById('form-editar');
    const formData = new FormData(form);
    window.initialData = new Map();
    for (let pair of formData.entries()) {
      window.initialData.set(pair[0], pair[1].trim());
    }
  });

  function confirmarGuardado() {
    const form = document.getElementById('form-editar');
    const currentData = new FormData(form);

    // Validar campos obligatorios excepto telefono_fijo
    for (let [key, value] of currentData.entries()) {
      // Saltar telefono_fijo (no obligatorio)
      if (key === 'telefono_fijo') continue;

      if (!value.trim()) {
        Swal.fire({
          icon: 'warning',
          title: 'Campo obligatorio',
          text: `Por favor completa el campo "${key.replace('_', ' ')}".`
        });
        // Poner foco en el input correspondiente
        const input = form.querySelector(`[name="${key}"]`);
        if (input) input.focus();
        return;
      }
    }

    // Verificar si hubo cambios
    let hasChanges = false;
    for (let [key, value] of currentData.entries()) {
      const valorInicial = window.initialData.get(key) || '';
      if (value.trim() !== valorInicial) {
        hasChanges = true;
        break;
      }
    }

    if (!hasChanges) {
      Swal.fire({
        icon: 'warning',
        title: 'Sin cambios detectados',
        text: 'No has modificado ningún campo.',
        confirmButtonText: 'Entendido'
      });
      return;
    }

    Swal.fire({
      title: '¿Estás seguro?',
      text: 'Se guardarán los cambios realizados.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Sí, guardar',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        form.submit();
      }
    });
  }
</script>

{% endblock %}
