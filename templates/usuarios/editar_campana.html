{% extends 'plantilla.html' %}
{% block title %}<title>Editar Campaña</title>{% endblock %}

{% load static %}
{% block content %}
{% include 'components/header.html' %}

<header class="page-header">
    <div class="container">
        <h1><i class="fa-solid fa-pen-to-square"></i> Editar Campaña</h1>
    </div>
</header>

<style>
  .no-change {
    border: 2px solid #dc3545 !important;
  }
</style>

<main class="main-container-actas">
    <div class="form-wrapper">
        <div class="form-container">
            <form id="form-editar-acta" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}

                <!-- Botón de guardar -->
                <button type="button" class="btn btn-primary" onclick="validarYConfirmar()">Guardar Cambios</button>

                <!-- Botón de volver -->
                <a href="{% url 'usuarios:registrar_campana' %}" class="btn btn-secondary ml-2">Volver</a>
            </form>
        </div>
    </div>
</main>

<script>
  let initialFormData = {};

  window.addEventListener('load', () => {
    const form = document.getElementById('form-editar-acta');
    const elements = form.elements;
    for (let i = 0; i < elements.length; i++) {
      const el = elements[i];
      if (el.name) {
        if (el.type === 'checkbox' || el.type === 'radio') {
          initialFormData[el.name] = el.checked;
        } else {
          initialFormData[el.name] = el.value.trim();
        }

        // Eliminar borde rojo al editar
        el.addEventListener('input', () => el.classList.remove('no-change'));
      }
    }
  });

  function validarYConfirmar() {
    const form = document.getElementById('form-editar-acta');
    const elements = form.elements;

    let camposValidos = true;
    let cambios = false;

    // Quitar marcas anteriores
    for (let i = 0; i < elements.length; i++) {
      elements[i].classList.remove('no-change');
    }

    // Validar obligatorios
    const nombre = form.querySelector('[name="nombre_campana"]');
    const estado = form.querySelector('[name="estado"]');

    if (!nombre.value.trim()) {
      nombre.classList.add('no-change');
      nombre.focus();
      camposValidos = false;
    }

    if (!estado.value.trim()) {
      estado.classList.add('no-change');
      if (camposValidos) estado.focus();
      camposValidos = false;
    }

    if (!camposValidos) return;

    // Verificar cambios respecto a los valores iniciales
    for (let i = 0; i < elements.length; i++) {
      const el = elements[i];
      if (!el.name) continue;

      const actual = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value.trim();
      const inicial = initialFormData[el.name];

      if (actual !== inicial) {
        cambios = true;
        break;
      }
    }

    // Si no hay cambios, marcar todo en rojo
    if (!cambios) {
      for (let i = 0; i < elements.length; i++) {
        const el = elements[i];
        if (el.name && el.type !== 'hidden') {
          el.classList.add('no-change');
        }
      }
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // Enviar si todo está bien
    form.submit();
  }
</script>

{% endblock %}
