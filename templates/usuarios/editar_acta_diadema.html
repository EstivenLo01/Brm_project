{% extends 'plantilla.html' %}
{% block title %}<title>Editar Acta de Diadema</title>{% endblock %}

{% block content %}
{% include 'components/header.html' %}

<header class="page-header">
    <div class="container">
        <h1><i class="fa-solid fa-headset"></i> Editar Acta de Diadema</h1>
    </div>
</header>

<main class="main-container-actas">
    <div class="form-wrapper">
        <div class="form-container">
            <form id="form-editar-acta-diadema" method="post" novalidate>
                {% csrf_token %}
                {% for campo in form %}
                <div class="form-group">
                    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                    {{ campo }}
                </div>
                {% endfor %}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="{% url 'usuarios:registrar_acta_diadema' %}" class="btn btn-secondary">Volver</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
  const form = document.getElementById('form-editar-acta-diadema');

  // Guardar los valores originales al cargar
  const valoresOriginales = {};
  form.querySelectorAll('input, select, textarea').forEach(field => {
    if (field.name) {
      valoresOriginales[field.name] = field.value.trim();
    }
  });

  form.addEventListener('submit', function (event) {
    let seModifico = false;
    let camposValidos = true;

    // Limpiar bordes previos
    form.querySelectorAll('input, select, textarea').forEach(field => {
      field.style.border = '';
    });

    // Revisar si se modificó algún campo y validar vacíos en campos modificados
    form.querySelectorAll('input, select, textarea').forEach(field => {
      if (!field.name) return;

      const valorOriginal = valoresOriginales[field.name];
      const valorActual = field.value.trim();

      if (valorActual !== valorOriginal) {
        seModifico = true;
        if (valorActual === '') {
          field.style.border = '2px solid red';
          camposValidos = false;
        }
      }
    });

    if (!seModifico) {
      // No se modificó nada: marcar todos los campos en rojo
      form.querySelectorAll('input, select, textarea').forEach(field => {
        if (field.name) {
          field.style.border = '2px solid red';
        }
      });
      camposValidos = false; // para evitar envío
    }

    if (!camposValidos) {
      event.preventDefault();
    }
  });
</script>

{% endblock %}
